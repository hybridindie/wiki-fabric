name: Corpus lint

# The corpus repo's own CI: this repo IS the team knowledge (remote root ==
# corpus content — no prefix/branch games under the standalone-repo model).
# Every push must pass the governance floor, not just machines where someone
# remembers to run lint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: corpus-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint + OKF floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Checkout harness (the lint tooling)
        uses: actions/checkout@v4
        with:
          repository: hybridindie/wiki-fabric
          ref: main
          path: harness

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Deps
        run: |
          cd harness
          uv venv
          uv pip install pyyaml openai anthropic

      - name: Lint corpus (0-error gate)
        run: |
          cd harness
          WIKI_FABRIC_DIR="$(pwd)/" uv run wf lint "$(dirname "$(pwd)")"

      - name: Catalog freshness (rebuild must be a no-op)
        run: |
          cd harness
          CORPUS="$(dirname "$(pwd)")"
          cp "$CORPUS/registry/catalog.json" /tmp/catalog-before.json 2>/dev/null || echo "{}" > /tmp/catalog-before.json
          WIKI_FABRIC_DIR="$(pwd)/" uv run wf rebuild-index || true
          python3 -c "import json,sys; a=json.load(open('/tmp/catalog-before.json')); b=json.load(open(sys.argv[1]+'/registry/catalog.json')); sys.exit(0 if json.dumps(a,sort_keys=True)==json.dumps(b,sort_keys=True) else 1)" "$CORPUS" || { echo "catalog.json is stale — run: wf rebuild-index (WIKI_FABRIC_DIR=<fabric>) and commit"; exit 1; }
          echo "catalog consistent"

      - name: Sync conflicts block (deterministic)
        run: |
          if ls "$(dirname "$(pwd)")/registry/conflicts/" 2>/dev/null | grep -q .; then
            echo "Unresolved sync conflicts present — resolve then push"
            ls "$(dirname "$(pwd)")/registry/conflicts/"
            exit 1
          else
            echo "no unresolved conflicts"
          fi