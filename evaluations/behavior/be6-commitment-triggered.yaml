# BE6 — prospective memory: deferred obligations resurface at the right task

The commitment ("after the schema migration passes, update the contract test")
must appear in the manifest for a migration task — the agent is reminded of
its deferred obligation *before* it can forget it. This is the prospective
half of the memory taxonomy: episodic records the past; commitments bind the
future. (Negative case covered in tests/test_context.py: a UI task must not
surface it.)