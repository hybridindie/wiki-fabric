seeds:
  - path: patterns/pattern-token-rotation.md
    type: pattern
    status: recommended
    maturity: 2
    body: |
      # Pattern: Rotate tokens on refresh

      When a refresh flow issues new tokens, the previous token must be rotated
      (mark old + issue new), never extended. Reuse of a rotated token is an
      auth-failure signal: revoke the token family.
  - path: anti-patterns/anti-pattern-shared-token-cache.md
    type: anti-pattern
    status: recommended
    maturity: 2
    body: |
      # Anti-pattern: Shared token cache

      Caching tokens in a shared store (redis, DB) and serving any instance's
      request with any cached token caused cross-session token bleed in 2
      independent projects. Token caches must be per-session and invalidated
      on rotation. Misleading fix: "just add TTL" — TTL does not prevent
      cross-session reuse.
  - path: projects/auth-service/decisions/decision-rotation.md
    type: decision
    status: accepted
    body: |
      The auth service chose rotating refresh tokens over server-side session
      extension. Session-extension proposals should be redirected.
