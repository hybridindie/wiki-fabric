[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-fabric"
version = "0.4.1"
description = "Evidence-first knowledge base that compounds across projects — one fabric, many project namespaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wiki", "knowledge-base", "agents", "claude", "opencode", "evidence", "provenance", "okf", "mcp"]

dependencies = [
    "pyyaml>=6.0",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.scripts]
# Phase 2 (#118): pure-python dispatch — verbs map to shipped scripts.
wf = "wiki_fabric.cli:main"
# #117: the fabric's core surface as MCP tools (the `mcp` extra)
wf-mcp = "wiki_fabric.mcp_server:main"

[project.urls]
Homepage = "https://hybridindie.github.io/wiki-fabric/"
Repository = "https://github.com/hybridindie/wiki-fabric"
Issues = "https://github.com/hybridindie/wiki-fabric/issues"

[project.optional-dependencies]
# #117: the MCP server extra (same shape as graphify's mcp extra).
mcp = ["mcp>=2,<3"]
embeddings = ["numpy", "sentence-transformers"]
# On-device compiler routes (llm.local_model): HF download + backends.
# llama-cpp-python (GGUF) is universal — the recommended testing backend;
# mlx-lm is Apple-Silicon-only (faster on M-series when installed).
local = [
    "huggingface_hub>=0.24",
    "llama-cpp-python>=0.3; sys_platform == 'darwin' or sys_platform == 'linux'",
    "mlx-lm>=0.19; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=8.0", "mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The harness tree IS the product: ship it as data (phase-1 keeps the bash
# orchestrator as the behavior source; scripts are run, not imported).
wiki_fabric = ["_harness/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs real on-device models (GGUF/MLX) — slow; deselect with -m 'not live'",
]

[tool.uv]
package = true