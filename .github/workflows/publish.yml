name: Publish to PyPI

# Release flow: push a tag v* → build sdist+wheel → publish via trusted
# publisher (OIDC — no token secret needed; configure once on PyPI:
# pypi.org → project wiki-fabric → publishing → GitHub Actions, environment
# `pypi`, owner hybridindie, repo wiki-fabric, workflow publish.yml).
#
# Prereqs (run before tagging):
#   python3 scripts/pkg/prep-package.py
#   python3 -m build
#   uv run pytest tests/ -m "not live" -q
#   bash scripts/smoke-test.sh
#   bash scripts/pkg/wheel-smoke.sh   (CI runs it in the build job)

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Deps
        run: |
          uv venv
          uv pip install . build

      - name: Prep harness tree
        run: python3 scripts/pkg/prep-package.py

      - name: Build sdist + wheel
        run: |
          uv pip install -q -U build       # the runner's preinstalled 'build' lacks __main__
          uv run build --outdir dist       # console script via the venv
          ls -la dist

      - name: Smoke the wheel
        run: WHEEL_SMOKE_SKIP_BUILD=1 bash scripts/pkg/wheel-smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # PyPI trusted-publisher environment name
    permissions:
      id-token: write             # OIDC — no API token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1