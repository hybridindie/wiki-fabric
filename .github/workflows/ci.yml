name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30   # capture-git smoke test reads history

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create venv + install deps
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install ".[mcp]"
          uv pip install pytest

      - name: Unit tests (pytest)
        run: uv run pytest tests/ -q

      - name: Smoke test (isolated temp fabric, uv-aware)
        run: bash scripts/smoke-test.sh

      - name: Behavior evaluation (P4, zero-LLM)
        run: uv run wf eval behavior

      - name: Stability evaluation (deterministic gates)
        run: uv run wf eval stability --skip-llm

      - name: Fabric lint (0 errors gate, seeded corpus — the repo carries no
          content corpus; the smoke covers the empty case)
        run: |
          SEED=$(mktemp -d)
          uv run wf install --dir "$SEED" >/dev/null
          WIKI_FABRIC_DIR="$SEED" uv run wf lint "$SEED/corpus"

      - name: OKF v0.2 conformance (floor gate)
        if: matrix.python-version == '3.12'
        run: |
          # seed like the lint step (step envs don't share SEED; on a bare
          # runner CORPUS_ROOT resolves to site-packages/../vault — nonexistent)
          SEED=$(mktemp -d /tmp/wf-okf-seed.XXXXXX)
          uv run wf install --dir "$SEED" >/dev/null
          WIKI_FABRIC_DIR="$SEED" uv run wf lint --okf "$SEED/corpus"

      - name: OKF cross-check (okflint, external validator)
        if: matrix.python-version == '3.12'
        run: |
          uv tool install okflint
          okflint validate --manifest okf-base.yaml

      - name: Wheel smoke (build → clean venv → packaged wf)
        if: matrix.python-version == '3.12'
        run: bash scripts/pkg/wheel-smoke.sh