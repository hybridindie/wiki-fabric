name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30   # capture-git smoke test reads history

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create venv + install deps
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install ".[mcp]"
          uv pip install pytest

      - name: Unit tests (pytest)
        run: uv run pytest tests/ -q

      - name: Smoke test (isolated temp fabric, uv-aware)
        run: bash scripts/smoke-test.sh

      - name: Behavior evaluation (P4, zero-LLM)
        run: uv run python scripts/eval/eval-behavior.py

      - name: Stability evaluation (deterministic gates)
        run: uv run python scripts/eval/eval-stability.py --skip-llm

      - name: Fabric lint (0 errors gate)
        run: uv run python scripts/cmd/lint.py .

      - name: OKF v0.2 conformance (floor gate)
        if: matrix.python-version == '3.12'
        run: uv run python scripts/cmd/lint.py . --okf

      - name: OKF cross-check (okflint, external validator)
        if: matrix.python-version == '3.12'
        run: |
          uv tool install okflint
          okflint validate --manifest okf-base.yaml

      - name: Wheel smoke (build → clean venv → packaged wf)
        if: matrix.python-version == '3.12'
        run: bash scripts/pkg/wheel-smoke.sh